<head>

<style>
:root{
  --bg:#0a0a0b;--bg2:#111113;--card:#16161a;--card2:#1c1c21;--line:#26262c;
  --y:#C19933;--y2:#A07A1F;--yr:193,153,51;--on:#17130a;--tabbg:rgba(18,18,21,.92);--text:#f4f4f5;--muted:#8d8d96;
  --bad:#ff6b6b;--warn:#ffb020;--ok:#3ddc84;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(600px 300px at 90% -50px,rgba(var(--yr),.07),transparent 70%),var(--bg);
  min-height:100vh;padding-bottom:120px;line-height:1.35}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 0}
.muted{color:var(--muted);font-size:13px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px}
.sec .ic{color:var(--y)}
.sec .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--y)}

/* cabecera */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--y),var(--y2));color:var(--on);border-radius:26px;padding:20px 20px 18px;margin-bottom:16px;box-shadow:0 18px 40px -22px rgba(var(--yr),.45)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero small{font-weight:700;opacity:.7;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.hero h1{font-size:30px;letter-spacing:-.03em;font-weight:800;margin:2px 0 16px;position:relative}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;position:relative;z-index:1}
.stats div{background:rgba(10,10,11,.92);color:var(--y);border-radius:16px;padding:12px 8px;text-align:center;min-width:0;overflow-wrap:anywhere}
.stats b{display:block;font-size:16px;letter-spacing:-.01em}
.stats span{font-size:11px;color:#c9c9cf}

/* mosaicos */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 6px 14px;text-align:center;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.96)}
.tile .bubble{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(var(--yr),.12);color:var(--y)}
.tile.hi .bubble{background:var(--y);color:var(--on)}

/* items */
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.item .grow{flex:1;min-width:0}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:14px;background:rgba(var(--yr),.14);color:var(--y);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.big{width:54px;height:54px;border-radius:18px;font-size:20px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.ok{background:rgba(61,220,132,.14);color:var(--ok)}
.pill.warn{background:rgba(255,176,32,.15);color:var(--warn)}
.pill.bad{background:rgba(255,107,107,.15);color:var(--bad)}
.pill.off{background:#232328;color:var(--muted)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--y);color:var(--on);border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--y);border:1px solid rgba(var(--yr),.45)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,107,.45)}
.btn.block{display:flex;width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;display:grid;place-items:center}
.x:hover{color:var(--bad)}

/* formularios */
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font-size:15px;margin-top:6px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(var(--yr),.15)}
select{appearance:none;-webkit-appearance:none;padding-right:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23c9c9d1' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dias{display:flex;gap:6px;margin:6px 0 14px}
.dia{flex:1;margin:0}
.dia input{display:none}
.dia span{display:grid;place-items:center;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-weight:700;cursor:pointer}
.dia input:checked+span{background:var(--y);color:var(--on);border-color:var(--y)}
.fsec{font-size:12px;font-weight:800;color:var(--y);letter-spacing:.08em;text-transform:uppercase;margin:6px 0 10px}
.hidden{display:none}

/* saldo */
.saldo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.saldo .big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.saldo .big.bad{color:var(--bad)}.saldo .big.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:14px}
.kv div{background:var(--card2);border-radius:14px;padding:10px;text-align:center}
.kv b{display:block;font-size:14px}.kv span{font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--y2));border-radius:99px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600}
.chip.y{background:rgba(var(--yr),.14);color:var(--y);border-color:transparent}
.info{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.info:last-child{border:0}
.info .ic{color:var(--y);margin-top:1px}
.info small{display:block;color:var(--muted);font-size:12px}

/* movimientos */
.mov{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mov:last-child{border:0}
.mov .dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none}
.mov .dot.in{background:rgba(61,220,132,.14);color:var(--ok)}
.mov .dot.out{background:rgba(255,107,107,.14);color:var(--bad)}
.mov .grow{flex:1;min-width:0}
.mov small{display:block;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--y);font-weight:700}
.delta{font-weight:800}.delta.ok{color:var(--ok)}.delta.bad{color:var(--bad)}

/* portal */
.banner{display:flex;gap:10px;align-items:center;background:rgba(var(--yr),.1);border:1px dashed rgba(var(--yr),.5);color:var(--y);padding:10px 12px;border-radius:14px;font-size:12.5px;font-weight:600;margin-bottom:14px}

/* flotante y menú */
.wa{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--y);color:var(--on);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 0 5px rgba(var(--yr),.14);z-index:20}
.wa svg{width:30px;height:30px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:496px;background:var(--tabbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;display:flex;justify-content:space-around;padding:8px 4px;z-index:15}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:16px}
.tabbar a.on{color:var(--y)}
.tabbar a.on .ic{filter:none}
body.portal .tabbar{display:none}
body.portal{padding-bottom:100px}
body.portal .wa{bottom:calc(24px + env(safe-area-inset-bottom))}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty .ic{width:34px;height:34px;color:#44444c;margin-bottom:8px}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 30px;gap:8px;align-items:end;margin-bottom:8px}
.price-row input{margin-top:0;padding:10px}
.price-row .nm{font-weight:700;font-size:14px;padding-bottom:10px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 30px;gap:8px;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700}

/* ---- editar app ---- */
.hero small{display:block;max-width:58%}
.hero .edit-btn{position:absolute;top:14px;right:14px;z-index:2;display:inline-flex;align-items:center;gap:6px;background:rgba(10,10,11,.86);color:var(--y);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
.sws{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{background:var(--card2);border:2px solid transparent;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-weight:600;font-size:12px;font-family:inherit;cursor:pointer}
.sw i{width:34px;height:34px;border-radius:50%;display:block}
.sw.on{border-color:var(--y)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--y);color:var(--on);border-color:var(--y)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--y);box-shadow:none;height:34px}
.between{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
</style>
</head>

<script>
/* ================= iconos ================= */
const P = {
  home:'<path d="M3.5 10.8 12 3.5l8.5 7.3V19a1.5 1.5 0 0 1-1.5 1.5h-3.8v-5.6H8.8v5.6H5A1.5 1.5 0 0 1 3.5 19z"/>',

  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.500a3 3 0 0 1 6 0V8"/>',
  arrowin:'<path d="M12 5v13M6.500 13 12 18.500 17.500 13"/>',
  arrowout:'<path d="M12 19V6M6.500 11 12 5.500 17.500 11"/>',

  palette:'<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-.9 2-1.8 0-1.4-1.2-1.5-1.2-2.7 0-.9.8-1.5 1.7-1.5H17a3.5 3.5 0 0 0 3.5-3.5C20.5 6.5 16.800 3.500 12 3.5z"/><circle cx="7.8" cy="11" r="1"/><circle cx="10.2" cy="7.6" r="1"/><circle cx="14.2" cy="7.6" r="1"/>'
};
const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24">${P[n] || ''}</svg>`;

/* ================= datos ================= */
const KEY = 'hector-gym-v2';
const OLD = 'hector-gym-v1';
const WA_HECTOR = '18292665369';
const META = {grasa:'Perder grasa', masa:'Ganar masa muscular', tono:'Tonificar'};
const FREC = {semanal:{n:'Semanal', dias:7, sem:1}, quincenal:{n:'Quincenal', dias:14, sem:2}, mensual:{n:'Mensual', dias:28, sem:4}};
const DIAS = [['L','Lunes'],['M','Martes'],['X','Miércoles'],['J','Jueves'],['V','Viernes'],['S','Sábado'],['D','Domingo']];
const MED = [['peso','Peso (lb)'],['estatura','Estatura (cm)'],['pecho','Pecho'],['cintura','Cintura'],['cadera','Cadera'],['brazo','Brazo'],['pierna','Pierna'],['grasa','% grasa']];

const CAT0 = () => ({
  planes:[
    {id:'p3', nombre:'3 días por semana', precio:500, min:350, auto:true},
    {id:'p5', nombre:'5 días por semana', precio:750, min:500, auto:true},
    {id:'dia', nombre:'Día suelto', precio:200, min:200, auto:false},
    {id:'nada', nombre:'Sin plan', precio:0, min:0, auto:false}
  ],
  dietas:[
    {id:'masa', nombre:'Aumento de masa muscular', meta:'masa'},
    {id:'desinf', nombre:'Desinflamación', meta:'grasa'},
    {id:'keto', nombre:'Keto + ayuno 16/8', meta:'grasa'},
    {id:'nada', nombre:'Sin dieta', meta:''}
  ]
});

let db = cargar();
function cargar(){
  try{
    const v2 = JSON.parse(localStorage.getItem(KEY));
    if (v2 && v2.clientes) return v2;
  }catch(e){}
  const base = {clientes:[], cat:CAT0()};
  try{
    const v1 = JSON.parse(localStorage.getItem(OLD));
    if (v1 && v1.clientes){
      const mapP = {'3':'p3','5':'p5','dia':'dia','ninguno':'nada'};
      const precios = {p3:500, p5:750, dia:200, nada:0};
      v1.clientes.forEach(o => {
        const plan = mapP[o.plan] || 'nada';
        base.clientes.push({
          id:o.id, nombre:o.nombre, usuario:o.telefono || '', telefono:o.telefono || '',
          registro:o.inicio, inicio:o.inicio, meta:o.meta || 'grasa', plan,
          cuota: o.referido ? Math.round(precios[plan]*.8) : precios[plan],
          frecuencia:o.frecuencia || 'semanal', dieta:o.dieta === 'ninguna' ? 'nada' : (o.dieta || 'nada'),
          dias:o.dias || [], hora:o.hora || '', notaDieta:'', notaPlan:'',
          activo:o.activo !== false, cargos:[], pagos:o.pagos || [], medidas:o.medidas || []
        });
      });
    }
  }catch(e){}
  return base;
}
function guardarDB(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'RD$' + Number(n || 0).toLocaleString('es-DO');
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const hoy = () => iso(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fdate = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const dd = (a,b) => Math.round((new Date(a+'T12:00') - new Date(b+'T12:00')) / 864e5);

/* ================= cuentas ================= */
function periodos(c){
  const pl = planDe(c);
  if (!c.activo || !pl.auto || !c.inicio || !c.cuota) return [];
  const f = FREC[c.frecuencia] || FREC.semanal;
  const out = []; const d = new Date(c.inicio + 'T12:00'); const fin = new Date(hoy() + 'T12:00');
  for (let i = 0; d <= fin && i < 400; i++){
    out.push({id:'auto'+i, fecha:iso(d), concepto:`${pl.nombre} · ${f.sem === 1 ? '1 semana' : f.sem + ' semanas'}`, monto:Number(c.cuota) * f.sem, auto:true});
    d.setDate(d.getDate() + f.dias);
  }
  return out;
}
function cuenta(c){
  const auto = periodos(c);
  const cargos = [...auto, ...c.cargos];
  const tc = sum(cargos, 'monto'), tp = sum(c.pagos, 'monto');
  return {cargos, auto, totalCargos:tc, pagado:tp, saldo:tc - tp};
}
function proximoCobro(c){
  const pl = planDe(c);
  if (!c.activo || !pl.auto || !c.inicio) return null;
  const f = FREC[c.frecuencia] || FREC.semanal;
  const n = Math.max(0, Math.floor(dd(hoy(), c.inicio) / f.dias) + 1);
  const d = new Date(c.inicio + 'T12:00'); d.setDate(d.getDate() + n * f.dias);
  return iso(d);
}
function estado(c){
  const k = cuenta(c), pl = planDe(c);
  if (k.saldo > 0){
    const f = FREC[c.frecuencia] || FREC.semanal;
    const per = pl.auto ? Number(c.cuota) * f.sem : 0;
    return {t:'Debe ' + money(k.saldo), k:(pl.auto && k.saldo <= per) ? 'warn' : 'bad'};
  }
  if (!c.activo) return {t:'Inactivo', k:'off'};
  if (!pl.auto && c.plan === 'nada') return {t:'Sin plan', k:'off'};
  return {t:'Al día', k:'ok'};
}
function semana(c){ return c.inicio ? Math.floor(dd(hoy(), c.inicio) / 7) + 1 : 0; }
function waLink(c, text){
  let d = String(c.telefono || '').replace(/\D/g,'');
  if (d.length === 10) d = '1' + d;
  return `https://wa.me/${d}${text ? '?text=' + encodeURIComponent(text) : ''}`;
}
function cuotaOpts(planId, cuota){
  const pl = db.cat.planes.find(p => p.id === planId) || {precio:0, min:0};
  const set = [];
  if (pl.precio) set.push([pl.precio, 'Precio completo']);
  const ref = Math.max(Math.round(pl.precio * .8), pl.min);
  if (pl.precio && ref < pl.precio) set.push([ref, 'Con 1 referido (−20%)']);
  if (pl.precio && pl.min < ref) set.push([pl.min, 'Mínimo con referidos']);
  const vals = set.map(s => s[0]);
  const otro = cuota !== '' && cuota != null && !vals.includes(Number(cuota));
  return set.map(([v,l]) => `<option value="${v}" ${Number(cuota) === v ? 'selected' : ''}>${money(v)} · ${l}</option>`).join('')
    + `<option value="otro" ${otro ? 'selected' : ''}>Otro monto…</option>`;
}

const ACENTOS = {

  esmeralda:{n:'Esmeralda', h:152, s:45}, rojo:{n:'Rojo', h:2, s:60}, azul:{n:'Azul', h:212, s:60}
};
const FONDOS = {
  negro:{n:'Negro', bg:'#0a0a0b', card:'#16161a', card2:'#1c1c21', line:'#26262c', tab:'rgba(18,18,21,.92)'},
  gris:{n:'Gris oscuro', bg:'#17181b', card:'#202227', card2:'#282b31', line:'#34373e', tab:'rgba(32,34,39,.94)'}
};
const LETRAS = {m:{n:'Normal', z:1}, g:{n:'Grande', z:1.12}, xg:{n:'Muy grande', z:1.25}};
const T0 = {acento:'oro', brillo:48, fondo:'negro', letra:'m', negocio:'Definición X Héctor', nombre:'Héctor'};
let T = (() => {

  return {...T0, ideas:[], ...saved};
})();
function guardarTema(){ try{ localStorage.setItem(TKEY, JSON.stringify(T)); }catch(e){} }
function hsl2rgb(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [0, 8, 4].map(n => Math.round(f(n) * 255));
}
function aplicarTema(){
  const a = ACENTOS[T.acento] || ACENTOS.oro, f = FONDOS[T.fondo] || FONDOS.negro, L = Number(T.brillo) || 48;
  const c1 = hsl2rgb(a.h, a.s, L), c2 = hsl2rgb(a.h, a.s, Math.max(L - 9, 20));
  const r = document.documentElement.style;
  r.setProperty('--y', `rgb(${c1})`); r.setProperty('--y2', `rgb(${c2})`); r.setProperty('--yr', c1.join(','));
  r.setProperty('--on', L >= 44 ? '#17130a' : '#ffffff');
  r.setProperty('--bg', f.bg); r.setProperty('--card', f.card); r.setProperty('--card2', f.card2);
  r.setProperty('--line', f.line); r.setProperty('--tabbg', f.tab);
  const z = (LETRAS[T.letra] || LETRAS.m).z;
  $('#app').style.zoom = z === 1 ? '' : z;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', f.bg);
}
const conservarScroll = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };
function setTema(k, v){ T[k] = v; guardarTema(); aplicarTema(); conservarScroll(route); }
function setBrillo(v){
  T.brillo = Number(v); guardarTema(); aplicarTema();
  const e = $('#brv'); if (e) e.textContent = v + '%';
  document.querySelectorAll('.sw').forEach(b => { const a = ACENTOS[b.dataset.k]; b.querySelector('i').style.background = `rgb(${hsl2rgb(a.h, a.s, T.brillo)})`; });
}
function setTexto(k, v){ T[k] = v; guardarTema(); }
function resetTema(){
  if (!confirm('¿Volver al color, fondo y tamaño de letra originales?')) return;
  const ideas = T.ideas; T = {...T0, ideas}; guardarTema(); aplicarTema(); conservarScroll(route);
}
function addIdea(e){
  e.preventDefault(); const t = $('#idea_t').value.trim(); if (!t) return;
  T.ideas.push({id:uid(), t, fecha:hoy()}); guardarTema(); conservarScroll(route);
}
function delIdea(id){ T.ideas = T.ideas.filter(x => x.id !== id); guardarTema(); conservarScroll(route); }
function copiarIdeas(btn){
  const txt = T.ideas.map((x, i) => (i + 1) + '. ' + x.t).join('\n');
  const listo = () => { btn.textContent = 'Lista copiada'; };
  const alt = () => {
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); listo(); } catch(e) { alert(txt); }
    t.remove();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(listo, alt); else alt();
}

/* ================= grafica ================= */
function grafica(ms){
  const pts = ms.filter(m => m.peso !== '' && m.peso != null).sort((a,b) => a.fecha.localeCompare(b.fecha));
  if (pts.length < 2) return `<div class="muted">Registra al menos 2 pesos para ver la gráfica.</div>`;
  const v = pts.map(p => Number(p.peso)); const mn = Math.min(...v) - 2, mx = Math.max(...v) + 2;
  const W = 320, H = 130;
  const xy = pts.map((p,i) => [10 + i * (W - 20) / (pts.length - 1), H - 12 - (Number(p.peso) - mn) / (mx - mn) * (H - 24)]);
  const line = xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--y)" stop-opacity=".30"/><stop offset="1" style="stop-color:var(--y)" stop-opacity="0"/></linearGradient></defs>
    <polygon fill="url(#g)" points="${xy[0][0]},${H} ${line} ${xy[xy.length-1][0]},${H}"/>
    <polyline fill="none" style="stroke:var(--y)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${line}"/>
    ${xy.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" style="fill:var(--bg);stroke:var(--y)" stroke-width="2.5"/>`).join('')}
  </svg>`;
}
function cambioPeso(ms){
  const pts = ms.filter(m => m.peso !== '' && m.peso != null).sort((a,b) => a.fecha.localeCompare(b.fecha));
  if (pts.length < 2) return '';
  const dif = Number(pts[pts.length-1].peso) - Number(pts[0].peso);
  return `<div class="muted" style="margin-top:6px">${pts[0].peso} → ${pts[pts.length-1].peso} lb · <span class="delta ${dif <= 0 ? 'ok' : 'bad'}">${dif > 0 ? '+' : ''}${dif.toFixed(1)} lb</span> desde el inicio</div>`;
}
function movs(c, borrar){

  if (!all.length) return vacio('wallet','Sin movimientos todavía.');
  return all.slice(0,60).map(m => `<div class="mov">
